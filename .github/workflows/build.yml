name: Engine safety net
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]
        preset: [linux-release, linux-debug-asan]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libsdl2-dev libsdl2-image-dev libopenal-dev libalut-dev libtinyxml2-dev libphysfs-dev libgl1-mesa-dev libglu1-mesa-dev xvfb xauth xdotool clang-tidy libglm-dev nlohmann-json3-dev
      - run: cmake --preset ${{ matrix.preset }} -DCMAKE_CXX_COMPILER=${{ matrix.compiler }} -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      - run: cmake --build --preset ${{ matrix.preset }} -j2
      - run: ctest --preset ${{ matrix.preset }}
      - name: New production core clang-tidy
        if: matrix.compiler == 'clang++' && matrix.preset == 'linux-release'
        run: |
          clang-tidy tests/core_lint.cpp -- -std=c++17 -I.
          python3 tests/run_production_lint.py --database build/${{ matrix.preset }}
      - name: Distribution packages
        if: matrix.compiler == 'g++' && matrix.preset == 'linux-release'
        run: cpack --config build/${{ matrix.preset }}/CPackConfig.cmake -G 'DEB;ZIP'

      - name: AppImage distribution
        if: matrix.compiler == 'g++' && matrix.preset == 'linux-release'
        run: |
          curl -fL https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20251107-1/linuxdeploy-x86_64.AppImage -o build/linuxdeploy-x86_64.AppImage
          echo 'c20cd71e3a4e3b80c3483cef793cda3f4e990aca14014d23c544ca3ce1270b4d  build/linuxdeploy-x86_64.AppImage' | sha256sum -c
          curl -fL https://github.com/AppImage/type2-runtime/releases/download/continuous/runtime-x86_64 -o build/runtime-x86_64
          echo '617aa77314d57c8b8e4fae9c3f0b35af7b30d5529cb69e98f64f92510ed98a46  build/runtime-x86_64' | sha256sum -c
          chmod +x build/linuxdeploy-x86_64.AppImage
          LDAI_RUNTIME_FILE="$PWD/build/runtime-x86_64" LINUXDEPLOY="$PWD/build/linuxdeploy-x86_64.AppImage" cmake --build --preset linux-release --target appimage
      - name: Core RHI integration
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          sanitizer_args=()
          if [ '${{ matrix.preset }}' = 'linux-debug-asan' ]; then sanitizer_args+=(--asan); fi
          xvfb-run -a -s '-screen 0 640x480x24' python3 tests/run_rhi.py --binary build/${{ matrix.preset }}/bin/rhi_tests --output build/rhi-gate "${sanitizer_args[@]}"
      - name: In-window intro playback and skip
        if: matrix.compiler == 'g++' && matrix.preset == 'linux-release'
        run: xvfb-run -a -s '-screen 0 640x480x24' python3 tests/test_intro.py --binary build/linux-release/bin/trackrs --output build/intro-proof
      - name: Edition menu navigation and capture
        if: matrix.compiler == 'g++' && matrix.preset == 'linux-release'
        run: xvfb-run -a -s '-screen 0 640x480x24' python3 tests/test_edition_ui.py --binary build/linux-release/bin/trackrs --output build/edition-ui
      - name: Replay determinism
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          ALSOFT_DRIVERS: "null"
        run: |
          xvfb-run -a -s '-screen 0 640x480x24' python3 tests/run_baselines.py --binary build/${{ matrix.preset }}/bin/trackrs --output build/results --quick
      - name: Audited ASan integration
        if: matrix.preset == 'linux-debug-asan'
        run: |
          xvfb-run -a -s '-screen 0 640x480x24' python3 tests/run_asan.py --binary build/${{ matrix.preset }}/bin/trackrs --output build/asan-audit
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: linux-${{ matrix.compiler }}-${{ matrix.preset }}
          path: |
            build/results
            *.deb
            *.zip
            build/linux-release/*.AppImage
            build/asan-audit
            build/rhi-gate
            build/intro-proof
            build/edition-ui
            build/${{ matrix.preset }}/Testing
            build/${{ matrix.preset }}/bin
  windows-msvc:
    runs-on: windows-2022
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/build/vcpkg-cache
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - id: dependency-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ github.workspace }}/build/vcpkg-cache
          key: windows-vcpkg-${{ hashFiles('vcpkg.json') }}
          restore-keys: windows-vcpkg-
      - name: Pinned dependency registry
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:VCPKG_DEFAULT_BINARY_CACHE" | Out-Null
          git clone https://github.com/microsoft/vcpkg.git "${{ runner.temp }}/trackrs-vcpkg"
          git -C "${{ runner.temp }}/trackrs-vcpkg" checkout 9a5dfef5d1a0438a7d24856a85bd60f309d355e9
          & "${{ runner.temp }}/trackrs-vcpkg/bootstrap-vcpkg.bat" -disableMetrics
      - name: Configure
        shell: pwsh
        run: cmake -S . -B build/windows -G "Visual Studio 17 2022" -A x64 "-DCMAKE_TOOLCHAIN_FILE=${{ runner.temp }}/trackrs-vcpkg/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        if: steps.dependency-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ github.workspace }}/build/vcpkg-cache
          key: windows-vcpkg-${{ hashFiles('vcpkg.json') }}
      - name: Build with compiler diagnostics
        shell: pwsh
        run: |
          cmake --build build/windows --config Release --parallel 2 2>&1 | Tee-Object -FilePath build/windows/build.log
          $buildExit = $LASTEXITCODE
          if ($buildExit -ne 0) {
            Get-Content build/windows/build.log | Select-String 'error C[0-9]+|fatal error|error LNK[0-9]+' | Select-Object -First 15 | ForEach-Object {
              $message = $_.Line.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
              Write-Output "::error::$message"
            }
          }
          exit $buildExit
      - name: Tests with failure annotations
        shell: pwsh
        run: |
          ctest --test-dir build/windows -C Release --output-on-failure 2>&1 | Tee-Object -FilePath build/windows/ctest.log
          $testExit = $LASTEXITCODE
          if ($testExit -ne 0) {
            $message = (Get-Content -Raw build/windows/ctest.log).Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error::$message"
          }
          exit $testExit
      - name: Windows distributions
        shell: pwsh
        run: cpack --config build/windows/CPackConfig.cmake -C Release -G 'ZIP;NSIS' -B build/windows/packages
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: windows-msvc
          path: |
            build/windows/bin
            build/windows/build.log
            build/windows/ctest.log
            build/windows/packages
  windows-mingw:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja mingw-w64-ucrt-x86_64-SDL2
            mingw-w64-ucrt-x86_64-SDL2_image
            mingw-w64-ucrt-x86_64-openal mingw-w64-ucrt-x86_64-freealut
            mingw-w64-ucrt-x86_64-physfs mingw-w64-ucrt-x86_64-tinyxml2
            mingw-w64-ucrt-x86_64-glm mingw-w64-ucrt-x86_64-nlohmann-json
      - shell: msys2 {0}
        run: |
          cmake --preset win-mingw-release
          cmake --build --preset win-mingw-release -j2
      - name: Tests with failure annotations
        shell: msys2 {0}
        run: |
          test_status=0
          ctest --preset win-mingw-release > build/win-mingw-release/ctest.log 2>&1 || test_status=$?
          cat build/win-mingw-release/ctest.log
          if [ "$test_status" -ne 0 ]; then
            message=$(<build/win-mingw-release/ctest.log)
            message=${message//'%'/'%25'}
            message=${message//$'\r'/'%0D'}
            message=${message//$'\n'/'%0A'}
            printf '::error::%s\n' "$message"
          fi
          exit "$test_status"
      - name: Windows portable distribution
        shell: msys2 {0}
        run: |
          package_status=0
          cpack --config build/win-mingw-release/CPackConfig.cmake -G ZIP -B build/win-mingw-release/packages > build/win-mingw-release/package.log 2>&1 || package_status=$?
          cat build/win-mingw-release/package.log
          if [ "$package_status" -ne 0 ]; then
            message=$(<build/win-mingw-release/package.log)
            message=${message//'%'/'%25'}
            message=${message//$'\r'/'%0D'}
            message=${message//$'\n'/'%0A'}
            printf '::error::%s\n' "$message"
          fi
          exit "$package_status"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: windows-mingw
          path: |
            build/win-mingw-release/bin
            build/win-mingw-release/ctest.log
            build/win-mingw-release/packages
            build/win-mingw-release/package.log
